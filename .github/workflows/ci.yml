name: CI - train, test and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  train-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Train the model
        run: python train.py

      - name: Run tests
        run: pytest -v

      - name: Build the Docker image
        run: docker build -t penguin-app:${{ github.sha }} .

      - name: Smoke test the container
        run: |
          docker run -d -p 8501:8501 -p 8001:8001 --name penguin-app penguin-app:${{ github.sha }}
          sleep 15
          curl -f http://localhost:8501/_stcore/health
